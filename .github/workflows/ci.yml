name: QA checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and question bank
        run: npm test

  browser-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.65.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance (synthetic microphone and local TTS stub)
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/qa-lab-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node tests/browser-voice.mjs
